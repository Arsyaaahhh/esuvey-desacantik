<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROUND CHECK PENDATAAN DESA CINTA STATISTIK (CANTIK) KOTA SURABAYA</title>

    <!-- Memanggil file CSS eksternal -->
    <link rel="stylesheet" href="css/landing.css">
    
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        
        <!-- Header / Logo BPS -->
        <div class="header">
            <img src="images/logo-bps.webp" alt="Logo BPS">
            <div class="header-text">
                Badan Pusat Statistik<br>
                Kota Surabaya
            </div>
        </div>

        <!-- Form Card -->
        <div class="card">
            <h2>GROUND CHECK PENDATAAN DESA CINTA STATISTIK (CANTIK) KOTA SURABAYA</h2>
            <p>Silakan isi data penanggung jawab pengisian kuesioner (PIC) sebelum melanjutkan ke formulir survei.</p>

            <!-- Menambahkan id="picForm" dan menghapus atribut action/method -->
            <form id="picForm">

                <!-- Nama Petugas -->
                <div class="form-group">
                    <label>Nama petugas <span class="text-danger">*</span></label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" name="nama_petugas" placeholder="Nama lengkap Petugas" required>
                    </div>
                </div>

                <!-- Nomor Telepon/WhatsApp -->
                <div class="form-group">
                    <label>Nomor Telepon/WhatsApp <span class="text-danger">*</span></label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" name="no_telp" placeholder="08xxxxxxxxxx" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label>Email <span class="text-danger">*</span></label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" name="email" placeholder="email@perusahaan.com" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-group submit-group">
                    <button type="submit" id="btnRumahTangga" class="btn-submit">
                        Lanjut ke Pendataan Rumah Tangga
                    </button>
                </div>

                <div class="form-group submit-group">
                    <button type="submit" id="btnIndividu" class="btn-submit">
                        Lanjut ke Pendataan Individu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Front-End Only -->
    <script src="js/config.js"></script>
    <script src="js/survey-store.js"></script>
    <script>
        // Gunakan variabel global untuk menentukan tujuan navigasi
        let destination = '';

        document.getElementById('btnRumahTangga').addEventListener('click', function() {
            destination = 'pages/keluarga/IdentitasKeluarga.html';
        });

        document.getElementById('btnIndividu').addEventListener('click', function() {
            destination = 'pages/individu/IdentitasKeluarga.html';
        });

        // Batasi No. Telepon: cuma boleh angka (boleh diawali tanda + di depan)
        const phoneInput = document.querySelector('input[name="no_telp"]');
        phoneInput.addEventListener('input', () => {
            const hasPlus = phoneInput.value.startsWith('+');
            const digits = phoneInput.value.replace(/\D/g, '');
            phoneInput.value = (hasPlus ? '+' : '') + digits;
        });

        function isValidPhone(value) {
            // Wajib angka, diawali 08 atau +62 / 62
            return /^(\+62|62|0)8[0-9]{7,12}$/.test(value);
        }

        document.getElementById('picForm').addEventListener('submit', function(e) {
            // Mencegah browser me-reload halaman
            e.preventDefault(); 

            const phone = this.no_telp.value.trim();
            if (!isValidPhone(phone)) {
                alert('Nomor Telepon/WhatsApp harus berupa angka, diawali 08 atau +62.');
                return;
            }
            
            // 1. Ambil data dari form (Opsional jika ingin ditampilkan di halaman berikutnya)
            const formData = {
                nama: this.nama_petugas.value,
                telp: phone,
                email: this.email.value
            };

            // 2. Setiap kali PIC form ini disubmit, itu artinya MULAI sesi
            // pendataan baru (rumah tangga/anggota yang baru) -- jadi buang
            // dulu sisa data survei dari sesi sebelumnya kalau ada yang
            // ketinggalan (misal sesi lama ditinggal sebelum sempat kirim),
            // supaya nggak ke-load bercampur ke sesi yang baru ini.
            SurveyStore.clear();
            SurveyStore.clearPhotos();
            localStorage.setItem('data_pic', JSON.stringify(formData));

            // Navigasi ke halaman yang dipilih
            if (destination) {
                window.location.href = destination;
            }
        });
    </script>
</body>
</html>
